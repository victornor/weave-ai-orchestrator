# CI on a pull request only once it is out of draft, plus a daily safety net on the landing branch.
# A worker opens its ticket PR as a draft (VS-393), so nothing runs while it is in review; the daemon
# marks it ready as it lands, and that single run evaluates the head that will land. There is no run
# on push to main — the merge queue lands exactly the head CI just passed — only the daily schedule
# and workflow_dispatch below. Separate jobs so each check is its own status.
#
# Every job runs on this repository's self-hosted runner, `weave-ci-01` (VS-394/VS-395), not on paid
# GitHub-hosted minutes: one container on the daemon's host with an 8-CPU CFS quota and a 16 GiB
# memory cap, isolated from the host. Setup, status, logs and removal are in `docs/OPERATIONS.md`,
# "Self-hosted CI runner".
# See openspec/changes/archive/2026-09-13-vs-329-add-github-actions-ci-lint-typecheck-and/,
# openspec/changes/vs-393-ci-runs-about-4-times-per-pr-run-it-once/ and
# openspec/changes/vs-395-switch-agent-conductor-s-ci-jobs-to-the/.
name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# A newer push to the same ref cancels the run still going for the previous commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The self-hosted runner is a container with an 8-CPU CFS quota (VS-394). Inside it,
  # `os.availableParallelism()`/`nproc` can still report the host's 32 cores, and vitest's forks pool
  # would size itself to 31, oversubscribing the quota. Cap the forks at the quota (VS-395).
  VITEST_MAX_FORKS: "8"

jobs:
  lint:
    name: lint
    runs-on: [self-hosted, linux, x64, weave-ci]
    timeout-minutes: 10
    # Skip a draft pull request; a scheduled or dispatched run is never a draft.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7
      # pnpm first: setup-node's cache needs it, and pnpm/action-setup reads the
      # `packageManager` field (pnpm@11.25.0) from package.json when no version is given.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Mirrors the `node = "26"` pin in mise.toml.
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: [self-hosted, linux, x64, weave-ci]
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `tsc -b tsconfig.json` builds the project references (including shared/dist)
      # itself, then the ui package is typechecked against them.
      - run: pnpm typecheck

  # VS-392 split the core/server suite into four shards because a private-repo GitHub-hosted runner
  # reported 2 CPUs and vitest's forks pool sized itself to one worker. That is wrong for the
  # self-hosted runner: it is a single runner with an 8-CPU quota, so four shard jobs would queue one
  # after another and re-run install/setup four times (VS-395). One `test-core` job now runs the whole
  # suite with the forks capped at 8 (workflow `VITEST_MAX_FORKS`); the required `test-core` check
  # name is unchanged.
  test-core:
    name: test-core
    runs-on: [self-hosted, linux, x64, weave-ci]
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A host tool, not a project dependency (see openspec/specs/host-tools/): several
      # core tests shell out to the real binary rather than a fake one (VS-327), the same
      # way this repo already does for `git`.
      - run: npm install -g @fission-ai/openspec@1.12.0
      # No prior build: vitest.config.ts aliases every @weave-ai/* package onto its
      # src/index.ts, so the core/server suite runs against sources.
      - run: pnpm exec vitest run

  test-ui:
    name: test-ui
    runs-on: [self-hosted, linux, x64, weave-ci]
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No prior build: packages/ui/vitest.config.ts aliases shared and render to source.
      - run: pnpm --filter @weave-ai/ui test