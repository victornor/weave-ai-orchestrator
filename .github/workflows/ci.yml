# CI on every pull request and every push to main. Four separate jobs so each one
# is its own check. See openspec/changes/vs-329-add-github-actions-ci-lint-typecheck-and/.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same ref cancels the run still going for the previous commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # pnpm first: setup-node's cache needs it, and pnpm/action-setup reads the
      # `packageManager` field (pnpm@11.25.0) from package.json when no version is given.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Mirrors the `node = "26"` pin in mise.toml.
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `tsc -b tsconfig.json` builds the project references (including shared/dist)
      # itself, then the ui package is typechecked against them.
      - run: pnpm typecheck

  test-core:
    name: test-core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No prior build: vitest.config.ts aliases every @weave-ai/* package onto its
      # src/index.ts, so the core/server suite runs against sources.
      - run: pnpm exec vitest run

  test-ui:
    name: test-ui
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No prior build: packages/ui/vitest.config.ts aliases shared and render to source.
      - run: pnpm --filter @weave-ai/ui test
