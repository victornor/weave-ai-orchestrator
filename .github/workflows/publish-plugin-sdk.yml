# Publishes @weave-ai/plugin-sdk to public npm on a tag (VS-385, design.md Decision 5).
# Never run from a ticket: a human tags a release (`plugin-sdk-v*`) to trigger this.
name: publish-plugin-sdk

on:
  push:
    tags:
      - 'plugin-sdk-v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      # `build:publish` bundles the four adapter/shared SDK packages' referenced types into a
      # single self-contained `dist/index.d.ts` and writes a publish-only `dist/package.json` with
      # no `workspace:*` dependency (nothing in the compiled JS imports them at runtime — every
      # reference in the source is `import type`, erased at compile time).
      - run: pnpm --filter @weave-ai/plugin-sdk run build:publish
      - run: npm publish --access public --provenance
        working-directory: packages/plugin-sdk/dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
