<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Responsive capture set</title>
<style>
/* ------------------------------------------------------------------ *
 * The AC Artifact Kit — Weave AI's design tokens plus a compact, dependency-free semantic
 * layer, for a single self-contained HTML artifact. No JavaScript, no build step, no external
 * reference of any kind. Dark is the default theme; add [data-theme='light'] to an ancestor
 * element to opt an artifact into the light theme.
 * ------------------------------------------------------------------ */

:root,
[data-theme='dark'] {
  color-scheme: dark;

  --bg-0: #050506;
  --bg-1: #0b0b0d;
  --bg-2: #101012;
  --bg-3: #17171a;
  --bg-input: #08080a;
  --line-1: #17171a;
  --line-2: #222226;
  --line-3: #313137;

  --text-1: #e9eaec;
  --text-2: #9ca1aa;
  --text-3: #868c95;
  --text-4: #868c95;
  --text-strong: #f2f3f5;
  --text-soft: #c6cad1;
  --text-body: #d8dbe0;
  --text-nav: #7c828b;

  --accent: #3d4148;
  --accent-link: #c6cad1;
  --accent-hover: #c6cad1;
  --accent-on: #fff;
  --accent-tint: rgb(61 65 72 / 0.13);
  --accent-tint-strong: rgb(61 65 72 / 0.18);
  --accent-edge: rgb(61 65 72 / 0.34);
  --focus-ring: rgb(61 65 72 / 0.18);

  --status-idle: #8a8f98;
  --status-working: #e9a23b;
  --status-stalled: #c98a2e;
  --status-blocked: #ff6b4a;
  --status-needs-you: #7c87f0;
  --status-merging: #8a8f98;
  --status-done: #7c828b;
  --status-failed: #e5484d;
  --status-paused: #8a8f98;

  --overlay: rgb(0 0 0 / 0.62);
  --elev-sheet: 0 16px 48px rgb(0 0 0 / 0.6);
  --elev-float: 0 4px 16px rgb(61 65 72 / 0.4);
}

[data-theme='light'] {
  color-scheme: light;

  --bg-0: #f7f8f9;
  --bg-1: #fff;
  --bg-2: #f2f3f5;
  --bg-3: #eaecef;
  --bg-input: #fff;
  --line-1: #e6e8eb;
  --line-2: #d3d6db;
  --line-3: #c7cad0;

  --text-1: #16181c;
  --text-2: #565a61;
  --text-3: #676c74;
  --text-4: #676c74;
  --text-strong: #0c0d10;
  --text-soft: #3d4148;
  --text-body: #24272c;
  --text-nav: #676c74;

  --accent: #3d4148;
  --accent-link: #3d4148;
  --accent-hover: #3d4148;
  --accent-on: #fff;
  --accent-tint: rgb(61 65 72 / 0.09);
  --accent-tint-strong: rgb(61 65 72 / 0.18);
  --accent-edge: rgb(61 65 72 / 0.34);
  --focus-ring: rgb(61 65 72 / 0.18);

  --status-idle: #6b7078;
  --status-working: #8a5e14;
  --status-stalled: #96631a;
  --status-blocked: #c93a17;
  --status-needs-you: #4a55c4;
  --status-merging: #4e535b;
  --status-done: #565a61;
  --status-failed: #c22b31;
  --status-paused: #6b7078;

  --overlay: rgb(16 24 32 / 0.28);
  --elev-sheet: 0 16px 48px rgb(16 24 32 / 0.18);
  --elev-float: 0 4px 16px rgb(61 65 72 / 0.3);
}

:root {
  --space-1: 0.125rem;
  --space-2: 0.25rem;
  --space-3: 0.375rem;
  --space-4: 0.5rem;
  --space-5: 0.75rem;
  --space-6: 1rem;
  --space-7: 1.5rem;
  --space-8: 2rem;
  --space-9: 3rem;

  --r4: 0.25rem;
  --r6: 0.375rem;
  --r8: 0.5rem;
  --r10: 0.625rem;
  --r-pill: 999px;
  --r-device: 1.625rem;

  --ff-ui: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --ff-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace;

  /* The type scale is one family scaled by this multiplier, matching index.css (VS-551). An artifact
     document defines it at 1; it is the same expression the app's own root block carries. */
  --fs-scale: 1;
  --fs-display: calc(1.75rem * var(--fs-scale));
  --fs-title: calc(1.25rem * var(--fs-scale));
  --fs-head: calc(1rem * var(--fs-scale));
  --fs-body: calc(0.875rem * var(--fs-scale));
  --fs-ui: calc(0.8125rem * var(--fs-scale));
  --fs-meta: calc(0.75rem * var(--fs-scale));
  --fs-micro: calc(0.6875rem * var(--fs-scale));
  --fs-nano: calc(0.625rem * var(--fs-scale));

  --track-display: -0.02em;
  --track-title: -0.015em;
  --track-head: -0.01em;
  --track-micro: 0.02em;
  --track-label: 0.1em;

  --dur-fast: 80ms;
  --ease: cubic-bezier(0.2, 0.8, 0.3, 1);
}

/* ------------------------------------------------------------------ * base * ---------------- */

*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
}
body {
  background: var(--bg-0);
  color: var(--text-1);
  font-family: var(--ff-ui);
  font-size: var(--fs-body);
  line-height: 1.5;
}
::selection {
  background: var(--accent-tint-strong);
}
a {
  color: var(--accent-link);
}
:focus-visible {
  outline: none;
  border-radius: var(--r4);
  box-shadow: 0 0 0 3px var(--focus-ring);
}

/* ------------------------------------------------------------- * layout safety * ------------- */

.grid, .row, .cols {
  display: flex;
  min-width: 0;
}
.grid > *, .row > *, .cols > * {
  min-width: 0;
}
.prose, .table, .badge, .label {
  overflow-wrap: anywhere;
}
img, svg, video {
  max-width: 100%;
  height: auto;
}

/* -------------------------------------------------------------- * semantic layer * ------------ */

.page {
  max-width: 960px;
  margin: 0 auto;
  padding: var(--space-8);
}
.section {
  margin-block: var(--space-8);
}
.section > h2 {
  font-size: var(--fs-title);
  letter-spacing: var(--track-title);
  color: var(--text-strong);
  margin: 0 0 var(--space-5);
}
.card {
  background: var(--bg-1);
  border: 1px solid var(--line-1);
  border-radius: var(--r6);
  padding: var(--space-6);
}
.panel {
  background: var(--bg-1);
  border: 1px solid var(--line-2);
  border-radius: var(--r8);
  padding: var(--space-7);
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-6);
  border-radius: var(--r6);
  border: 1px solid var(--line-2);
  background: var(--bg-2);
  color: var(--text-1);
  font-family: var(--ff-ui);
  font-size: var(--fs-ui);
  text-decoration: none;
  transition: background var(--dur-fast) var(--ease);
}
.btn:hover {
  background: var(--bg-3);
}
.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-on);
}
.btn-primary:hover {
  background: var(--accent-hover);
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-4);
  border-radius: var(--r-pill);
  border: 1px solid var(--line-1);
  background: var(--bg-2);
  color: var(--text-2);
  font-family: var(--ff-mono);
  font-size: var(--fs-nano);
  letter-spacing: var(--track-label);
  text-transform: uppercase;
}
.status-idle { color: var(--status-idle); }
.status-working { color: var(--status-working); }
.status-stalled { color: var(--status-stalled); }
.status-blocked { color: var(--status-blocked); }
.status-needs-you { color: var(--status-needs-you); }
.status-merging { color: var(--status-merging); }
.status-done { color: var(--status-done); }
.status-failed { color: var(--status-failed); }
.status-paused { color: var(--status-paused); }
.status-dot::before {
  content: '';
  display: inline-block;
  width: 0.5em;
  height: 0.5em;
  margin-right: var(--space-3);
  border-radius: 50%;
  background: currentColor;
}
.table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--fs-body);
}
.table th, .table td {
  padding: var(--space-4) var(--space-5);
  border-bottom: 1px solid var(--line-1);
  text-align: left;
}
.table th {
  color: var(--text-2);
  font-size: var(--fs-meta);
  font-weight: 500;
  letter-spacing: var(--track-label);
  text-transform: uppercase;
}
code, kbd {
  font-family: var(--ff-mono);
  font-size: 0.9em;
}
code {
  background: var(--bg-2);
  padding: 0.1em 0.35em;
  border-radius: var(--r4);
}
kbd {
  background: var(--bg-3);
  border: 1px solid var(--line-2);
  border-radius: var(--r4);
  padding: 0.05em 0.4em;
  box-shadow: 0 1px 0 var(--line-3);
}
pre code {
  display: block;
  padding: var(--space-6);
  border-radius: var(--r6);
  background: var(--bg-2);
  overflow-x: auto;
}
.steps {
  list-style: decimal;
  margin: 0;
  padding-left: var(--space-7);
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}
.steps > li {
  padding-left: var(--space-3);
}
.timeline {
  list-style: none;
  margin: 0;
  padding-left: var(--space-7);
  border-left: 2px solid var(--line-2);
  display: flex;
  flex-direction: column;
  gap: var(--space-7);
}
.timeline > li {
  position: relative;
}
.timeline > li::before {
  content: '';
  position: absolute;
  left: calc(-1 * var(--space-7) - 5px);
  top: 0.4em;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
}

/* -------------------------------------------------------------- * image gallery * ------------ */
/* A labelled grid of images whose cells open into a full-viewport, pannable, zoomable viewer.
   Pure CSS state: `:target` opens a cell, the hidden checkbox + label zooms it, `overflow: auto`
   pans. No JavaScript — the served artifact's CSP has no `script-src`, so a script would never run.
   Each image is embedded once; the same <img> is the thumbnail and the enlarged view. */

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: var(--space-5);
  margin: 0;
}
.gallery-figure {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  margin: 0;
  padding: var(--space-4);
  border: 1px solid var(--line-1);
  border-radius: var(--r6);
  background: var(--bg-1);
}
.gallery .shot {
  display: block;
  overflow: hidden;
  border: 1px solid var(--line-2);
  border-radius: var(--r4);
  background: var(--bg-2);
  line-height: 0;
}
.gallery .shot img {
  display: block;
  width: 100%;
  height: auto;
}
.gallery-caption {
  font-size: var(--fs-meta);
  color: var(--text-2);
}

/* Visually hidden but still focusable, so the zoom control is keyboard-reachable. */
.gallery-zoom {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  border: 0;
  clip-path: inset(50%);
  overflow: hidden;
  white-space: nowrap;
}
.gallery-close,
.gallery-zoom-btn,
.gallery-nav {
  display: none;
}

/* --- the cell, once targeted, becomes the viewer --- */
.gallery-figure:target {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-5);
  margin: 0;
  padding: var(--space-8);
  border: 0;
  border-radius: 0;
  background: var(--overlay);
  overflow: auto;
  overscroll-behavior: contain;
}
.gallery-figure:target .shot {
  margin: auto;
  border: 0;
  background: none;
  overflow: visible;
}
.gallery-figure:target .shot img {
  width: auto;
  height: auto;
  max-width: 100%;
  max-height: 80vh;
  border-radius: var(--r6);
  box-shadow: var(--elev-sheet);
}
.gallery-figure:target .gallery-caption {
  color: var(--text-soft);
  text-align: center;
}
/* Zoom to natural size; the auto margins stop centring and the viewer scrolls to pan. */
.gallery-zoom:checked ~ .shot img {
  max-width: none;
  max-height: none;
}
.gallery-figure:target .gallery-close,
.gallery-figure:target .gallery-zoom-btn,
.gallery-figure:target .gallery-nav {
  display: inline-flex;
}
.gallery-close {
  position: fixed;
  top: var(--space-6);
  right: var(--space-6);
  z-index: 21;
}
.gallery-zoom-btn {
  position: fixed;
  top: var(--space-6);
  right: calc(var(--space-6) + 5rem);
  z-index: 21;
  cursor: pointer;
}
.gallery-zoom-btn::after {
  content: 'Zoom';
}
.gallery-zoom:checked ~ .gallery-zoom-btn::after {
  content: 'Fit';
}
.gallery-nav {
  position: fixed;
  left: 50%;
  bottom: var(--space-6);
  gap: var(--space-4);
  z-index: 21;
  transform: translateX(-50%);
}
.gallery-nav a {
  min-width: 2.5rem;
  justify-content: center;
}
</style>
</head>
